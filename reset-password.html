<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kencal — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy:#1A2744; --navy-light:#24345a; --gold:#C8A84B; --gold-light:#ddc47f; --paper:#F7F5F1; --ink:#22242b; --ink-soft:#5b5f6b; --line:#dcd9d2; --warn:#b23b3b; --ok:#2e7d4f; --radius:10px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Segoe UI',-apple-system,sans-serif; }
  .topbar { background:var(--navy); color:#fff; padding:18px 22px; }
  .topbar .brand { font-weight:700; font-size:15px; letter-spacing:0.02em; }
  .topbar .brand span { color:var(--gold-light); }
  .wrap { max-width:420px; margin:60px auto; padding:0 18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:26px; text-align:center; }
  .card h1 { font-size:18px; color:var(--navy); margin:0 0 8px; }
  .card p.sub { font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
  .field { margin-bottom:14px; text-align:left; }
  .field label { display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:4px; }
  .field input { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .btn { display:block; width:100%; background:var(--navy); color:#fff; border:none; border-radius:8px; padding:13px; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px; }
  .btn:hover { background:var(--navy-light); }
  .result-ok { background:#eef7f1; border:1px solid #bfe3cc; color:#2e7d4f; padding:12px 14px; border-radius:8px; font-size:14px; font-weight:600; margin-top:14px; }
  .result-warn { background:#fbeeee; border:1px solid #ecc5c5; color:#b23b3b; padding:12px 14px; border-radius:8px; font-size:14px; font-weight:600; margin-top:14px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">KENCAL <span>ONBOARDING</span></div>
</div>

<div class="wrap">
  <div class="card" id="mainCard">
    <h1>Set a New Password</h1>
    <p class="sub" id="introText">Checking your link…</p>

    <div id="formArea" style="display:none">
      <div class="field"><label>New Password</label><input type="password" id="new_password"></div>
      <div class="field"><label>Confirm New Password</label><input type="password" id="confirm_password"></div>
      <button class="btn" id="saveBtn">Set Password</button>
    </div>
    <div id="resultArea"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://guxemrdukpiqpawskapv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6UwA2vBI-Bw-2Kndb198hg_LkQ0vpJF';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const introText = document.getElementById('introText');
const formArea = document.getElementById('formArea');
const resultArea = document.getElementById('resultArea');

// Supabase fires this once it's parsed the recovery token from the link
supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    introText.textContent = 'Enter a new password below.';
    formArea.style.display = 'block';
  }
});

// Fallback: if the event already fired before this listener attached
setTimeout(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && formArea.style.display === 'none') {
    introText.textContent = 'Enter a new password below.';
    formArea.style.display = 'block';
  } else if (!session) {
    introText.textContent = 'This link is invalid or has expired. Ask Rick to send a new one.';
  }
}, 1500);

document.getElementById('saveBtn').addEventListener('click', async () => {
  const pw = document.getElementById('new_password').value;
  const confirmPw = document.getElementById('confirm_password').value;

  if (pw.length < 8) { resultArea.innerHTML = '<div class="result-warn">Password must be at least 8 characters.</div>'; return; }
  if (pw !== confirmPw) { resultArea.innerHTML = '<div class="result-warn">Passwords don\'t match.</div>'; return; }

  resultArea.innerHTML = '<div class="sub">Saving…</div>';
  try {
    const { error } = await supabaseClient.auth.updateUser({ password: pw });
    if (error) throw new Error(error.message);
    resultArea.innerHTML = '<div class="result-ok">✓ Password updated. You can close this page and log in with your new password.</div>';
    formArea.style.display = 'none';
  } catch (err) {
    resultArea.innerHTML = `<div class="result-warn">${err.message || String(err)}</div>`;
  }
});
</script>

</body>
</html>
